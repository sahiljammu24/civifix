<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
  <title>CivicFix — Municipal Intelligence</title>
  <meta name="description" content="Report potholes, broken streetlights, and civic issues instantly. AI-powered detection routes directly to municipal dispatch." />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'on-primary-fixed-variant': '#0039b5', 'inverse-on-surface': '#eaf1ff',
            'primary': '#0037b0', 'surface-bright': '#f8f9ff', 'error': '#ba1a1a',
            'on-surface': '#0b1c30', 'secondary': '#565e74', 'secondary-fixed': '#dae2fd',
            'primary-fixed-dim': '#b7c4ff', 'tertiary-container': '#006b2c',
            'outline-variant': '#c4c5d7', 'surface-container-highest': '#d3e4fe',
            'inverse-primary': '#b7c4ff', 'primary-container': '#1d4ed8',
            'on-error-container': '#93000a', 'on-background': '#0b1c30',
            'on-secondary-fixed': '#131b2e', 'tertiary-fixed-dim': '#62df7d',
            'on-error': '#ffffff', 'tertiary-fixed': '#7ffc97', 'surface': '#f8f9ff',
            'surface-container-lowest': '#ffffff', 'primary-fixed': '#dce1ff',
            'surface-tint': '#2151da', 'on-surface-variant': '#434655',
            'on-tertiary-fixed-variant': '#005320', 'secondary-fixed-dim': '#bec6e0',
            'on-primary-container': '#cad3ff', 'on-primary': '#ffffff',
            'on-secondary-container': '#5c647a', 'inverse-surface': '#213145',
            'surface-variant': '#d3e4fe', 'on-tertiary-fixed': '#002109',
            'error-container': '#ffdad6', 'tertiary': '#00501f', 'on-secondary': '#ffffff',
            'surface-dim': '#cbdbf5', 'surface-container': '#e5eeff',
            'surface-container-low': '#eff4ff', 'surface-container-high': '#dce9ff',
            'secondary-container': '#dae2fd', 'background': '#f8f9ff',
            'on-tertiary': '#ffffff', 'outline': '#747686',
            'on-tertiary-container': '#71ee8a', 'on-primary-fixed': '#001551',
            'on-secondary-fixed-variant': '#3f465c'
          },
          borderRadius: { 'DEFAULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' },
          spacing: {
            'margin': '1rem', 'gutter': '1rem', 'gutter-lg': '1.5rem',
            'space-md': '1rem', 'space-xl': '2rem', 'space-xs': '0.25rem',
            'margin-md': '1.5rem', 'space-lg': '1.5rem', 'space-2xl': '3rem',
            'space-sm': '0.5rem', 'margin-lg': '2rem'
          },
          fontFamily: {
            'headline-md': ['Plus Jakarta Sans'], 'title-md': ['Inter'],
            'headline-xl-mobile': ['Plus Jakarta Sans'], 'body-lg': ['Inter'],
            'headline-sm': ['Plus Jakarta Sans'], 'headline-lg': ['Plus Jakarta Sans'],
            'title-sm': ['Inter'], 'label-sm': ['Inter'], 'body-md': ['Inter'],
            'headline-xl': ['Plus Jakarta Sans'], 'headline-lg-mobile': ['Plus Jakarta Sans'],
            'label-md': ['Inter'], 'body-sm': ['Inter']
          },
          fontSize: {
            'headline-md': ['24px', { lineHeight: '32px', letterSpacing: '-0.01em', fontWeight: '600' }],
            'title-md': ['16px', { lineHeight: '24px', fontWeight: '600' }],
            'headline-xl-mobile': ['30px', { lineHeight: '36px', letterSpacing: '-0.015em', fontWeight: '700' }],
            'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }],
            'headline-sm': ['20px', { lineHeight: '28px', fontWeight: '600' }],
            'headline-lg': ['32px', { lineHeight: '40px', letterSpacing: '-0.02em', fontWeight: '700' }],
            'title-sm': ['14px', { lineHeight: '20px', fontWeight: '600' }],
            'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.04em', fontWeight: '600' }],
            'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
            'headline-xl': ['40px', { lineHeight: '48px', letterSpacing: '-0.02em', fontWeight: '700' }],
            'headline-lg-mobile': ['24px', { lineHeight: '32px', letterSpacing: '-0.01em', fontWeight: '700' }],
            'label-md': ['13px', { lineHeight: '18px', letterSpacing: '0.01em', fontWeight: '500' }],
            'body-sm': ['12px', { lineHeight: '16px', fontWeight: '400' }]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body { width: 100vw; margin: 0; padding: 0; min-height: 100%; }
      body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    @media (max-width: 768px) {
      ::-webkit-scrollbar { display: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    }
    @media (min-width: 769px) {
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #e5eeff; } /* surface-container */
      ::-webkit-scrollbar-thumb { background: #b7c4ff; border-radius: 4px; } /* primary-fixed-dim */
      ::-webkit-scrollbar-thumb:hover { background: #0037b0; } /* primary */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    }
    .page-enter { animation: pageIn 0.35s cubic-bezier(0.22,1,0.36,1) forwards; }
    @keyframes pageIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .stagger-enter > * { opacity:0; transform:translateY(16px); animation: stgUp 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }
    .stagger-enter > *:nth-child(1){animation-delay:.05s}
    .stagger-enter > *:nth-child(2){animation-delay:.1s}
    .stagger-enter > *:nth-child(3){animation-delay:.12s}
    .stagger-enter > *:nth-child(4){animation-delay:.16s}
    .stagger-enter > *:nth-child(5){animation-delay:.2s}
    .stagger-enter > *:nth-child(6){animation-delay:.24s}
    .stagger-enter > *:nth-child(7){animation-delay:.28s}
    .stagger-enter > *:nth-child(8){animation-delay:.32s}
    @keyframes stgUp { to { opacity:1; transform:translateY(0); } }
    .toast-in { animation: tIn .4s cubic-bezier(.22,1,.36,1) forwards; }
    .toast-out { animation: tOut .3s ease-in forwards; }
    @keyframes tIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes tOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(20px)} }
  </style>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen">
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
